<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 找不到頁面 | ntnu.cc</title>
  <script>
    (function() {
      var t = localStorage.getItem('theme') || 'auto';
      var r = t === 'auto'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : t;
      document.documentElement.setAttribute('data-theme', r);
      var c = localStorage.getItem('color') || 'blue';
      document.documentElement.setAttribute('data-color', c);
    })();
  </script>
  <style>
    :root, [data-color="blue"] {
      --bg-primary: #F2F3FB;
      --bg-secondary: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #4a5568;
      --accent: #2E3192;
      --accent-hover: #5255B0;
      --border: #e2e8f0;
    }

    [data-color="red"] {
      --bg-primary: #FBF2F4;
      --accent: #9B2335;
      --accent-hover: #C94C5C;
    }

    [data-color="blue"][data-theme="dark"] {
      --accent: #7A7DC4;
      --accent-hover: #9B9EE0;
    }

    [data-color="red"][data-theme="dark"] {
      --accent: #D67485;
      --accent-hover: #E59DA8;
    }

    [data-theme="dark"] {
      --bg-primary: #0a0f1a;
      --bg-secondary: #1a1f2e;
      --text-primary: #e8eaed;
      --text-secondary: #b4b7bd;
      --border: #2d3340;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .error-code {
      font-size: 8rem;
      font-weight: bold;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    p {
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1>找不到此頁面</h1>
    <p>您要尋找的頁面不存在或已被移除。</p>
    <a href="/" class="btn">返回首頁</a>
  </div>
</body>
</html>
