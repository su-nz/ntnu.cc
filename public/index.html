<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ntnu.cc - 師大短網址服務</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-tertiary: #0f3460;
      --text-primary: #eaeaea;
      --text-secondary: #a0a0a0;
      --accent: #e94560;
      --accent-hover: #ff6b6b;
      --success: #2ecc71;
      --warning: #e67e22;
      --error: #e74c3c;
      --border: #333;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    
    .logo {
      font-size: 4rem;
      font-weight: bold;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .tagline {
      font-size: 1.5rem;
      color: var(--text-secondary);
      margin-bottom: 3rem;
    }
    
    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    .card h2 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }
    
    .info-box {
      background: var(--bg-tertiary);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    .info-box p {
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }
    
    .info-box p:last-child {
      margin-bottom: 0;
    }
    
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }
    
    .feature {
      text-align: center;
      padding: 1rem;
    }
    
    .feature-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    
    .feature-title {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    
    .feature-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }
    
    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    
    .btn-secondary {
      background: var(--bg-tertiary);
    }
    
    .footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    
    .footer a {
      color: var(--accent);
      text-decoration: none;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
    
    @media (max-width: 600px) {
      .logo {
        font-size: 2.5rem;
      }
      
      .tagline {
        font-size: 1.1rem;
      }
      
      .card {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="logo">ntnu.cc</div>
    <p class="tagline">國立臺灣師範大學短網址服務</p>
    
    <div class="card">
      <h2>🔗 關於本服務</h2>
      
      <div class="info-box">
        <p>本短網址服務專為<strong>國立臺灣師範大學</strong>師生設計，提供安全、快速的短網址轉換功能。</p>
        <p>服務僅限於<strong>師大校園網路</strong>內使用，請確認您已連接至校園網路或 VPN。</p>
      </div>
      
      <div class="features">
        <div class="feature">
          <div class="feature-icon">🚀</div>
          <div class="feature-title">快速轉址</div>
          <div class="feature-desc">全球 CDN 加速</div>
        </div>
        <div class="feature">
          <div class="feature-icon">🔒</div>
          <div class="feature-title">安全防護</div>
          <div class="feature-desc">CAPTCHA 驗證</div>
        </div>
        <div class="feature">
          <div class="feature-icon">📊</div>
          <div class="feature-title">統計分析</div>
          <div class="feature-desc">點擊追蹤</div>
        </div>
        <div class="feature">
          <div class="feature-icon">🏫</div>
          <div class="feature-title">校園專屬</div>
          <div class="feature-desc">IP 白名單</div>
        </div>
      </div>
    </div>
  </main>
  
  <footer class="footer">
    <p>© 2026 國立臺灣師範大學 | <a href="/admin">管理後台</a></p>
  </footer>
</body>
</html>
